<div class="auth-container">
  <div class="auth-background">
    <app-agent-backdrop [density]="0.8"></app-agent-backdrop>
    <div class="auth-vignette"></div>
  </div>

  <app-theme-toggle class="auth-theme-toggle"></app-theme-toggle>

  <div class="auth-card ay-spot" [class.is-busy]="loading">
    <span class="card-energy" aria-hidden="true"></span>

    <div class="card-header">
      <div class="logo-container">
        <svg class="ay-brand-glyph" viewBox="0 0 38 42" aria-hidden="true">
          <defs>
            <linearGradient id="ayBrandGrad" x1="4" y1="2" x2="34" y2="40" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#cfcfcf" />
              <stop offset=".42" stop-color="#8e8e8e" />
              <stop offset=".62" stop-color="#3f3f3f" />
              <stop offset="1" stop-color="#e6e6e6" />
            </linearGradient>
          </defs>
          <path d="M6 3.6 L30 20.4 L6 37.2 Z" fill="url(#ayBrandGrad)" />
          <path class="ay-brand-links" d="M6 3.6 L34 8.2 M30 20.4 L34 8.2 M30 20.4 L34 33.6 M6 37.2 L34 33.6" stroke="#8b8a8a" stroke-width="1.1" fill="none" />
          <circle class="ay-brand-node" cx="34" cy="8.2" r="2.9" fill="#fdfdfd" />
          <circle class="ay-brand-node ay-brand-node--b" cx="34" cy="33.6" r="2.9" fill="#fdfdfd" />
        </svg>
      </div>
      <h2 class="auth-title" appSplitReveal [splitDelay]="0.3">Create Your Account</h2>
      <p class="auth-subtitle">Join the next generation of video intelligence</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="auth-form">
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input
            id="name"
            type="text"
            formControlName="name"
            placeholder="Enter your full name"
            class="form-input"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 7l9 6 9-6"/>
          </svg>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            class="form-input"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M12 17a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Create a strong password"
            class="form-input"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M12 17a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
          <input
            id="confirmPassword"
            type="password"
            formControlName="confirmPassword"
            placeholder="Confirm your password"
            class="form-input"
          />
        </div>
      </div>

      <div class="error-message" *ngIf="err">
        <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{err}}
      </div>

      <button type="submit" [disabled]="loading" class="submit-btn ay-btn ay-btn-primary">
        <ng-container *ngIf="!loading">
          <svg class="ay-btn-icon" viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0 L10 6 L0 12 Z" fill="currentColor" /></svg>
          <span>Create Account</span>
        </ng-container>
        <span *ngIf="loading" class="loading-spinner"></span>
      </button>
    </form>

    <div class="auth-footer">
      <p class="footer-text">
        Already have an account?
        <a (click)="login()" class="auth-link">Sign in</a>
      </p>
      <p class="footer-text">
        <a routerLink="/" class="auth-link">&larr; Back to home</a>
      </p>
    </div>
  </div>
</div>
